# The mirror. The same `check.sh`, triggered from the side that usually breaks it.
#
# ragharness already runs this script (RagEval/.github/workflows/check.yml), and
# its own header says what it cannot do: the change that breaks the contract is
# normally a *llmwiki* change, and a workflow in that repository is not
# triggered by one. Its daily cron bounds the delay at a day; this file removes
# it, because the two repositories are versioned and reviewed separately and
# neither one's unit tests can see the seam.
#
# The defect that produced both files: llmwiki added a `timeout` parameter to
# `embed_query`, ragharness patches that function from the outside, and every
# budgeted turn raised TypeError. Both suites stayed green.
#
# ⛔ This runs the harness's script, not a copy of it. If what CI runs and what
# a person runs can differ, the gate is a description of a gate.
#
# ✅ **The split landed 2026-08-30 and this workflow is live.** It used to say it
# was INERT, and it was: `EvalRAG/.git` and `EvalRAG/wikillm_retrieval/.git` had
# the SAME remote — this one — with `main` branches sharing no common ancestor,
# so there was no harness repository to check out and the harness's own history
# had never been pushed anywhere. The harness now lives at its own address,
# `observable-labs/RagEval`, with that history intact.
#
# The checkout below stays driven by `vars.EVALRAG_REPOSITORY` rather than being
# hard-coded again. The name is now a *default* that works instead of one that
# never did, which is the only thing that changed about the mechanism.

name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # ⚠️ Both checkouts land UNDER a directory, never at the workspace root,
      # because `check.sh` resolves this package as `$HERE/../wikillm_retrieval`
      # from the harness. That sibling relationship is the whole layout contract
      # — it is what lets CI run the harness's script rather than a copy.
      - uses: actions/checkout@v4
        with:
          path: wikillm_retrieval

      # The harness, checked out beside this package.
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.EVALRAG_REPOSITORY || 'observable-labs/RagEval' }}
          ref: ${{ vars.EVALRAG_REF || '' }}
          path: RagEval
          token: ${{ secrets.EVALRAG_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install both, editable
        run: |
          python -m pip install --upgrade pip
          pip install -e "./RagEval[dev]"
          pip install -e ./wikillm_retrieval

      # No provider key on purpose: the eval smoke runs the lanes that need no
      # network, so the gate never fails for a reason the change did not cause.
      - name: check
        working-directory: RagEval
        run: scripts/check.sh
